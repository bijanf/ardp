[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ardp"
version = "0.1.0"
description = "AMOC Reanalysis Diagnostic Pipeline"
requires-python = ">=3.10"
dependencies = [
    "xarray[io]>=2023.1",
    "dask[complete]>=2023.1",
    "netcdf4>=1.6",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "xgcm>=0.8",
    "gsw>=3.6",
    "matplotlib>=3.7",
    "cartopy>=0.21",
    "cdsapi>=0.6",
    "copernicusmarine>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "xhistogram>=0.3",
]
cmip6 = [
    "intake-esm>=2023.1",
    "gcsfs>=2023.1",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
# plugins = ["numpy.mypy_plugin"]  # removed: not available in numpy>=2.0
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real data files"]
